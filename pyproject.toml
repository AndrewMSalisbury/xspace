[project]
name = "xspace"
version = "0.1.0"
description = "Expected Space: measuring the reachable, valuable space a defense leaves open — and how well the offense exploits it."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "kloppy>=3.15",
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=16",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "mplsoccer>=1.4",
    "tqdm>=4.66",
    "gdown>=6.4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xspace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
